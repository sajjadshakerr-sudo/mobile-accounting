<body>
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: var(--primary); font-weight: bold;">
            درحال بارگذاری سیستم...
        </div>
    </div>
    
    <script>
        window.SysUtils = {
            toEnglishDigits(str) {
                if (!str) return '';
                return str.toString().replace(/[\u0660-\u0669\u06f0-\u06f9]/g, c => c.charCodeAt(0) & 15);
            },
            formatNumber(num) {
                if (num === null || num === undefined || num === '') return '';
                const parsed = Number(num);
                return isNaN(parsed) ? '' : parsed.toLocaleString('en-US');
            },
            unformatNumber(str) {
                if (!str) return 0;
                const cleanStr = window.SysUtils.toEnglishDigits(str).replace(/,/g, '').replace(/\D/g, '');
                return Number(cleanStr) || 0;
            },
            getPersianDate() {
                const d = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
                return window.SysUtils.toEnglishDigits(d).replace(/\//g, '/');
            },
            getPersianDateInt(dateStr) {
                if (!dateStr) return 0;
                return parseInt(window.SysUtils.toEnglishDigits(dateStr).replace(/\//g, '')) || 0;
            },
            addMonthsPersian(dateStr, monthsToAdd) {
                if (!dateStr) return '';
                let parts = dateStr.split('/');
                if (parts.length !== 3) return dateStr;
                let y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
                m += monthsToAdd;
                while (m > 12) { m -= 12; y++; }
                return `${y}/${m.toString().padStart(2, '0')}/${d.toString().padStart(2, '0')}`;
            },
            getInstPaid(item) {
                if (item.payments && item.payments.length > 0) {
                    return item.payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                }
                return item.isPaid ? Number(item.amount || 0) : 0;
            },

            // الگوریتم محاسبه مالی و سود قطعی برای "فروش"
            getFinancials(sale) {
                if (!sale) return { finalPrice: 0, downPayment: 0, instPaid: 0, debt: 0, paymentPerInst: 0, totalInstDebt: 0, interestPerInst: 0, grandTotalProfit: 0, baseProfit: 0, paid: 0, expectedProfit: 0, realizedProfit: 0, cost: 0 };
                
                let finalPrice = Number(sale.sellPrice || sale.finalPrice || 0);
                const downPayment = Number(sale.downPayment || 0);
                let scheduleTotal = 0, schedulePaid = 0, quickPaid = 0, paid = 0, instPaid = 0;
                
                if (sale.payments && Array.isArray(sale.payments)) {
                    quickPaid = sale.payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
                }
                
                if (sale.paymentType === 'cash') {
                    paid = finalPrice;
                } else if (sale.paymentType === 'credit') {
                    paid = Number(sale.initialPayment || 0) + quickPaid;
                } else if (sale.paymentType === 'installment') {
                    if (sale.schedule && Array.isArray(sale.schedule) && sale.schedule.length > 0) {
                        sale.schedule.forEach(s => {
                            scheduleTotal += Number(s.amount || 0);
                            schedulePaid += window.SysUtils.getInstPaid(s);
                        });
                    } else {
                        scheduleTotal = (finalPrice - downPayment);
                    }
                    instPaid = schedulePaid + quickPaid;
                    finalPrice = downPayment + scheduleTotal;
                    paid = downPayment + instPaid;
                }

                const totalInstDebt = scheduleTotal;
                const debt = Math.max(0, finalPrice - paid);
                
                // --- منطق محاسبه سود قطعی و زیان (Cost-Recovery First) ---
                const buyPrice = Number(sale.buyPrice || 0);
                const partnerShare = Number(sale.partnerShare || 0);
                const cost = buyPrice + partnerShare; 
                
                const expectedProfit = finalPrice - cost; 
                
                let realizedProfit = 0;
                if (paid >= cost) {
                    realizedProfit = paid - cost;
                } else if (debt <= 0) {
                    realizedProfit = expectedProfit; 
                }
                // ------------------------------------------------------------------

                const baseProfit = Number(sale.profit || 0);
                
                let paymentPerInst = 0;
                if (sale.schedule && sale.schedule.length > 0) {
                    paymentPerInst = sale.schedule[0].amount;
                } else if (sale.installCount > 0) {
                    paymentPerInst = Math.round(totalInstDebt / sale.installCount);
                }
                const principal = (Number(sale.sellPrice || 0) - downPayment);
                const interestPerInst = Math.round(principal * ((sale.rate || 0) / 100));

                return { 
                    finalPrice, 
                    paid, 
                    downPayment, 
                    instPaid, 
                    debt, 
                    paymentPerInst, 
                    totalInstDebt, 
                    interestPerInst, 
                    baseProfit, 
                    grandTotalProfit: realizedProfit, 
                    expectedProfit, 
                    realizedProfit, 
                    cost 
                };
            },

            // الگوریتم محاسبه مالی و سود قطعی برای "تعمیرات"
            getRepairFinancials(repair) {
                const finalPrice = Number(repair.totalPrice || repair.totalCost || repair.price || 0);
                let paidAmount = Number(repair.initialPayment || repair.paid || 0);
                if (repair.payments && Array.isArray(repair.payments)) {
                    paidAmount += repair.payments.reduce((s, p) => s + Number(p.amount || 0), 0);
                }
                const debt = Math.max(0, finalPrice - paidAmount);
                
                // --- منطق محاسبه سود/زیان ---
                const partsCost = Number(repair.partsCost || 0);
                const partnerShare = Number(repair.partnerShare || 0);
                const cost = partsCost + partnerShare;
                
                const expectedProfit = finalPrice - cost; 
                
                let realizedProfit = 0;
                if (paidAmount >= cost) {
                    realizedProfit = paidAmount - cost;
                } else if (debt <= 0) {
                    realizedProfit = expectedProfit;
                }
                // ----------------------------------

                return { 
                    finalPrice, 
                    paidAmount, 
                    paid: paidAmount, 
                    debt, 
                    expectedProfit, 
                    realizedProfit, 
                    cost 
                };
            },

            getInitialPayment(sale) {
                if (!sale) return 0;
                if (sale.paymentType === 'installment') return Number(sale.downPayment || 0);
                if (sale.paymentType === 'credit') return Number(sale.initialPayment || 0);
                return Number(sale.sellPrice || 0); 
            },
            getPaymentTypeName(type) {
                if (type === 'cash') return 'نقدی';
                if (type === 'credit') return 'نسیه';
                if (type === 'installment') return 'اقساطی';
                return 'نامشخص';
            }
        };

        const DB = {
            dbName: 'ShopManagerDB_VuePro', version: 3, instance: null, initPromise: null, _invoiceLock: false, 
            init() {
                if (this.initPromise) return this.initPromise;
                this.initPromise = new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('sales')) db.createObjectStore('sales', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('repairs')) db.createObjectStore('repairs', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('partners')) db.createObjectStore('partners', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'id' });
                    };
                    request.onsuccess = (e) => { this.instance = e.target.result; resolve(this.instance); };
                    request.onerror = (e) => { console.error("خطا در اتصال:", e.target.error); this.initPromise = null; reject(e.target.error); };
                });
                return this.initPromise;
            },
            async ensureDB() { if (!this.instance) await this.init(); },
            generateId() { return `${Date.now()}_${Math.random().toString(36).substring(2, 11)}_${Math.floor(Math.random() * 1000)}`; },
            async getNextInvoiceNumber() {
                await this.ensureDB();
                while (this._invoiceLock) await new Promise(res => setTimeout(res, 50));
                this._invoiceLock = true;
                return new Promise((resolve, reject) => {
                    const tx = this.instance.transaction('settings', 'readwrite');
                    const request = tx.objectStore('settings').get('invoiceCounter');
                    request.onsuccess = () => {
                        let data = request.result || { id: 'invoiceCounter', value: 0 };
                        data.value += 1;
                        const putReq = tx.objectStore('settings').put(data);
                        putReq.onsuccess = () => { this._invoiceLock = false; resolve(`S-${data.value}`); };
                        putReq.onerror = (e) => { this._invoiceLock = false; reject(e.target.error); };
                    };
                    request.onerror = (e) => { this._invoiceLock = false; reject(e.target.error); };
                });
            },
            async getAll(storeName) {
                await this.ensureDB();
                return new Promise((resolve, reject) => {
                    const request = this.instance.transaction(storeName, 'readonly').objectStore(storeName).getAll();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = (e) => reject(e.target.error);
                });
            },
            async put(storeName, data) {
                await this.ensureDB();
                return new Promise((resolve, reject) => {
                    const request = this.instance.transaction(storeName, 'readwrite').objectStore(storeName).put(data);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            },
            async delete(storeName, id) {
                await this.ensureDB();
                return new Promise((resolve, reject) => {
                    const request = this.instance.transaction(storeName, 'readwrite').objectStore(storeName).delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e.target.error);
                });
            },
            async clearAll() {
                await this.ensureDB();
                return new Promise((resolve, reject) => {
                    const storeNames = ['sales', 'repairs', 'partners', 'settings'];
                    const tx = this.instance.transaction(storeNames, 'readwrite');
                    tx.oncomplete = () => resolve();
                    tx.onerror = (e) => reject(e.target.error);
                    storeNames.forEach(name => tx.objectStore(name).clear());
                });
            },
            async restoreBackup(backupData) {
                await this.ensureDB();
                if (!backupData || typeof backupData !== 'object') throw new Error('ساختار فایل پشتیبان نامعتبر است.');
                return new Promise((resolve, reject) => {
                    const storeNames = ['sales', 'repairs', 'partners', 'settings'];
                    const tx = this.instance.transaction(storeNames, 'readwrite');
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                    tx.onabort = () => reject(new Error('عملیات لغو شد.'));
                    try {
                        storeNames.forEach(storeName => {
                            const store = tx.objectStore(storeName);
                            store.clear(); 
                            if (backupData[storeName] && Array.isArray(backupData[storeName])) {
                                backupData[storeName].forEach(item => store.put(item));
                            }
                        });
                    } catch (error) { tx.abort(); }
                });
            }
        };
        DB.init().catch(err => console.error("بازسازی دیتابیس با خطا مواجه شد:", err));
        window.DB = DB;

        try {
            if (!window.Vue) throw new Error("کتابخانه Vue.js بارگذاری نشد.");
            if (!window['vue3-sfc-loader']) throw new Error("کتابخانه vue3-sfc-loader بارگذاری نشد.");
            const { loadModule } = window['vue3-sfc-loader'];
            const options = {
                moduleCache: { vue: Vue },
                async getFile(url) {
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`فایل پیدا نشد: ${url}`);
                    return { getContentData: asBinary => asBinary ? res.arrayBuffer() : res.text() }
                },
                addStyle(textContent) {
                    const style = Object.assign(document.createElement('style'), { textContent });
                    document.head.appendChild(style);
                },
            };
            const app = Vue.createApp({
                components: { 'AppLayout': Vue.defineAsyncComponent(() => loadModule('./App.vue', options)) },
                template: '<AppLayout></AppLayout>'
            });
            app.mount('#app');
        } catch(err) {
            console.error("Setup Error:", err);
            document.getElementById('app').innerHTML = `<div style="color:#dc2626; background:#fee2e2; padding:20px; text-align:center; margin:15px; border-radius:8px; border:1px solid #fecaca;">خطا در بارگذاری اولیه سیستم. لطفاً اینترنت خود را بررسی کنید.</div>`;
        }
    </script>
</body>
</html>
